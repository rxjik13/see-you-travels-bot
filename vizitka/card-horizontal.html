<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1800px;height:1000px;background:#14110f;font-family:Inter,sans-serif;color:#f3ece2;position:relative;overflow:hidden}
.photo{position:absolute;right:0;top:0;width:820px;height:1000px;background:url(photo.jpg) center 22%/cover}
.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#14110f 0%,rgba(20,17,15,.6) 18%,rgba(20,17,15,0) 50%)}
.frame{position:absolute;inset:44px;border:1px solid rgba(201,164,106,.45)}
.c{position:absolute;left:120px;top:120px;bottom:120px;width:960px;display:flex;flex-direction:column}
.brand{font:500 20px Inter;letter-spacing:.42em;color:#c9a46a;text-transform:uppercase}
.name{font:400 92px 'Liberation Serif',serif;margin-top:64px;line-height:1}
.role{font:300 28px Inter;color:#b8ab99;margin-top:22px}
.line{width:96px;height:1px;background:#c9a46a;margin:52px 0 48px}
.grid{display:grid;grid-template-columns:1fr 1fr;column-gap:56px;row-gap:34px}
.k{font:500 15px Inter;letter-spacing:.26em;color:#8c7d68;text-transform:uppercase;margin-bottom:8px}
.v{font:400 30px Inter}
.foot{margin-top:auto;font:300 19px Inter;color:#8c7d68;letter-spacing:.04em}
</style></head><body>
<div class="photo"></div><div class="frame"></div>
<div class="c">
<div class="brand">See You Travels</div>
<div class="name">Екатерина Шаталова</div>
<div class="role">Основатель See You Travels</div>
<div class="line"></div>
<div class="grid">
<div><div class="k">Сайт</div><div class="v">seeyoutravelss.netlify.app</div></div>
<div><div class="k">Instagram</div><div class="v">@shatal.ket</div></div>
<div><div class="k">Instagram · See You</div><div class="v">@seeyou.travels</div></div>
<div><div class="k">Telegram · See You</div><div class="v">@see_you_travels</div></div>
</div>
<div class="foot">Премиальные групповые путешествия для предпринимателей</div>
</div></body></html>
